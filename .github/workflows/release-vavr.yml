# Releases clauseway-vavr (logic/vavr) at the version its own POM names, on
# the button only: it changes when vavr does, not with the engine. Deploy
# stages a signed bundle; the Portal's Publish button stays manual.
name: Release clauseway-vavr

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and sign the bundle; upload nothing
        type: boolean
        default: false

concurrency:
  group: release-vavr
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Maven 3.9.11 — the runner's 3.10 writes resolver bookkeeping into the publishing plugin's staging directory and the Portal rejects the bundle
        run: |
          curl -fsSL "https://archive.apache.org/dist/maven/maven-3/3.9.11/binaries/apache-maven-3.9.11-bin.tar.gz" | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.9.11/bin" >> "$GITHUB_PATH"
      - name: Deploy (stages a bundle; nothing publishes without the Portal button)
        run: mvn -B -ntp clean deploy -P release -f vavr/pom.xml ${{ inputs.dry_run && '-DskipPublishing=true' || '' }}
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
